name: Palomar full preflight
run-name: Palomar full preflight for ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Your relationship to this formalization
        required: true
        type: choice
        default: I am a responsible author or maintainer
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

jobs:
  palomar-preflight:
    # Keep this revision and pipeline_commit identical when updating the verifier.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@3561d237dcc4b28482558ad28a64d767d7cc8615
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 3561d237dcc4b28482558ad28a64d767d7cc8615
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"Verification/palomar-principals.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":${{ toJSON(inputs.authorization_relationship) }}}
