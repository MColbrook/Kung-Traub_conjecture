fidelity:
  divergences: >-
    The real counterexamples are restrictions of entire functions that take
    real values on the real axis; consequences for the whole-line real-analytic
    class are proved. The grouped entire witnesses and simultaneous real
    counterexample strengthen the corresponding upper-bound statements.
    Polynomial root persistence uses factorization and evaluation estimates;
    limiting root multiplicities use synthetic division and compact root tuples.
    The complex near-identity root-existence argument uses contraction under
    the same value and derivative bounds, with the same discs and conclusions,
    in place of Rouché's theorem. Stage indices are zero-based.
