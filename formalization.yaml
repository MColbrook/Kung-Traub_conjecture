# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: v0.4
project:
  name: A formal proof of the Kung–Traub conjecture
  description: >-
    For deterministic stationary root-finding methods without memory, the
    Kung–Traub bound 2^(n-1) for n >= 1 real or complex scalar derivative
    observations, the bound given by the first group size times the product
    of one plus each subsequent size for prescribed positive groups, and
    entire counterexamples, including one real witness
    defeating every larger real exponent simultaneously. A concrete inverse
    Hermite method attains 2^(n-1) for n >= 2 on open real intervals and has
    that exact order on exp(x)-1. Supporting constructions are included.
  authors:
    - Matthew J. Colbrook
  responsible_maintainers:
    - Matthew J. Colbrook
  license: Apache-2.0
repository:
  url: https://github.com/MColbrook/Kung-Traub_conjecture
  role: substantive-development
sources:
  - title: 'Adversarial Wronskians: A proof of the Kung–Traub conjecture'
    authors: [Matthew J. Colbrook]
    id: https://doi.org/10.5281/zenodo.22850057
    type: paper
    location: Main theorem, prescribed-group corollary, supporting results, and Appendices A–B
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Version-specific Zenodo record published 2026-09-19. The source paper
      presents the mathematical argument formalized here; this repository
      does not claim to be the first presentation of the result.
  - title: Optimal order of one-point and multipoint iteration
    authors: [H. T. Kung, J. F. Traub]
    id: https://doi.org/10.1145/321850.321860
    type: paper
    relationship: background
    note: >-
      Journal of the ACM 21(4) (1974), 643–651. The manuscript attributes
      the attaining methods to this work.
  - title: Divided differences
    authors: [C. de Boor]
    id: arXiv:math/0502036
    type: paper
    location: Section 8, equation (44)
    relationship: background
    note: >-
      Surveys in Approximation Theory 1 (2005), 46–69. Source of the
      divided-difference estimate cited in the manuscript.
