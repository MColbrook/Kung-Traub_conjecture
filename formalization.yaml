fidelity:
  observation_and_order_model: >-
    Rules depend only on the start and earlier answers, have no access to
    the input function or root, and retain no state between updates. One
    derivative value of arbitrary natural order costs one observation;
    order zero is a function value and idle padding has no location or cost.
    One complex value counts as one complex observation. There are no
    continuity, measurability, or computability assumptions on the rules.
    Local constants precede every sufficiently close nonroot start and
    cannot depend on that individual start. Universal properties quantify
    over all inputs and simple roots. Local-domain statements additionally
    require every actual query to stay in the stated input domain.
  partial_rules: >-
    Principal counterexamples use total fixed-budget rules. Supporting
    theorems preserve early-stopping outputs by padding and preserve every
    defined execution of partial rules under arbitrary total extension.
    Partial local order requires defined output at every sufficiently close
    nonroot start. Transferring a total extension's local order back requires
    this full neighborhood of definition; a counterexample for an extension
    does not alone assert defined partial execution on its witness sequence.
  quantifiers_and_domains: >-
    Scalar upper bounds require n >= 1 and every real p > 2^(n-1).
    Grouped bounds require k >= 1 and fixed positive sizes, with queries in
    each group selected from earlier groups alone; p exceeds the first size
    times the product of one plus each subsequent size. Real witnesses are
    entire real-type functions with globally 3/4 <= f' <= 5/4, a unique real
    zero, and independent nonroot starts converging to it with error ratios
    tending to positive infinity. They need not be iteration orbits.
    The simultaneous result fixes one function, root, and sequence before
    quantifying over every larger real exponent. Complex witnesses are
    entire with norm(f'(z)-1) <= 1/4 on the closed unit disc, a zero strictly
    inside and unique in that disc, and divergent norm-based error ratios.
    Global uniqueness of complex zeros is not asserted. The complex
    universal-order consequence covers arbitrary open holomorphic domains.
    Attainment requires n >= 2 and covers analytic inputs on arbitrary open
    real intervals with query admissibility. The exponential asymptotic is
    two-sided, has denominator x^(2^(n-1)) and positive coefficient kappa_(n-1),
    with kappa_0=1, kappa_1=1/2, and kappa_(j+1)=product(kappa_i,i=1..j)/(j+2).
    Every larger real exponent fails for the same algorithm and exponential
    input. README.md describes each of the twelve selected declarations.
  divergences: >-
    The real counterexamples are restrictions of entire functions that take
    real values on the real axis; consequences for the whole-line real-analytic
    class are proved. The grouped entire witnesses and simultaneous real
    counterexample strengthen the corresponding upper-bound statements.
    Polynomial root persistence uses factorization and evaluation estimates;
    limiting root multiplicities use synthetic division and compact root tuples.
    The complex near-identity root-existence argument uses contraction under
    the same value and derivative bounds, with the same discs and conclusions,
    in place of Rouché's theorem. Stage indices are zero-based.
